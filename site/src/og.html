<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      body {
        background: radial-gradient(900px 500px at 15% 10%, #eef2ff, transparent), radial-gradient(800px 500px at 90% 90%, #fdf2f8, transparent), #fff;
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        align-items: center;
        padding: 0 70px;
        box-sizing: border-box;
        gap: 40px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 800;
        color: #0f172a;
      }
      .brand img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 58px;
        line-height: 1.08;
        letter-spacing: -1px;
        margin: 22px 0 16px;
        color: #0f172a;
      }
      h1 span {
        background: linear-gradient(135deg, #6366f1, #ec4899);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        font-size: 24px;
        color: #475569;
        margin: 0 0 26px;
      }
      .tags {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .tags b {
        font-weight: 600;
        font-size: 19px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #334155;
      }
      .shot {
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 70px rgba(15, 23, 42, 0.25);
        border: 1px solid #e2e8f0;
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand"><img src="icon.png" alt="" />Chatlings</div>
      <h1>Bong bóng chat nổi <span>cho máy tính</span></h1>
      <p>Zalo, Messenger, WhatsApp, Telegram, Discord… nhiều nick cùng lúc.</p>
      <div class="tags"><b>Miễn phí</b><b>Mã nguồn mở</b><b>Windows</b></div>
    </div>
    <div class="shot"><img src="chatlings-demo-vi.jpg" alt="" /></div>
  </body>
</html>
