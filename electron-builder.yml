appId: io.github.submit69.chatlings
productName: Chatlings
copyright: Copyright © 2026 Chatlings contributors
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - build/icon.png
  - build/tray*.png
  - package.json
  - "!**/*.map"
  # koffi is only used on Windows (presentation mode); drop the other OS binaries.
  - "!node_modules/@koromix/koffi-{linux,darwin,freebsd,openbsd,musl}*/**"
  - "!node_modules/koffi/vendor/**"
  - "!node_modules/koffi/doc/**"
asarUnpack:
  - "**/*.node"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: Chatlings-${version}-${arch}-${os}.${ext}
# Smaller download; the build takes a bit longer.
compression: maximum
nsis:
  oneClick: false
  perMachine: false # per-user install, no admin rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Chatlings
  runAfterFinish: true
  license: LICENSE
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: Chatlings
  # Language picker in the installer; English and Vietnamese
  multiLanguageInstaller: true
  installerLanguages: [en_US, vi_VN]
  # Uninstalling keeps your logins unless you delete %APPDATA%Chatlings yourself
  deleteAppDataOnUninstall: false
  artifactName: Chatlings-Setup-${version}.${ext}
portable:
  artifactName: Chatlings-${version}-portable.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Network
  maintainer: submit69 <submit69@users.noreply.github.com>
  vendor: Chatlings contributors
  synopsis: Floating chat heads for web chats, several accounts at once
  description: Chatlings puts Zalo, Messenger, WhatsApp, Telegram, Discord and other web chats in floating bubbles on the edge of the screen.
  desktop:
    entry:
      StartupWMClass: Chatlings
      Keywords: chat;zalo;messenger;whatsapp;telegram;discord;
appImage:
  artifactName: Chatlings-${version}-x86_64.${ext}
  # Ubuntu 23.10+ blocks the unprivileged user namespaces Chromium's sandbox
  # needs, and an AppImage cannot ship the setuid helper, so the AppImage runs
  # without the OS sandbox. The .deb installs the helper and keeps the sandbox.
  executableArgs: ["--no-sandbox"]
deb:
  artifactName: chatlings_${version}_amd64.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.social-networking
  # No Apple Developer certificate: ad-hoc signature, so the app runs on Apple
  # silicon. Gatekeeper still asks once (right-click → Open).
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Voice and video calls in your chat apps.
    NSCameraUsageDescription: Video calls in your chat apps.
dmg:
  artifactName: Chatlings-${version}-mac-${arch}.${ext}
publish:
  provider: github
  owner: submit69
  repo: chatlings
  releaseType: release
