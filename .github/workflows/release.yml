name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: `npm ci` runs third-party install scripts, and they must
# never get a token that can publish a release. Only the publish job can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }

  build-win:
    needs: test
    runs-on: windows-latest
    env:
      # Code signing turns on by itself once the SignPath secret exists
      # (see docs/code-signing.md). Without it the build is unsigned.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---- unsigned ----
      - name: Build
        if: env.SIGN != 'true'
        run: npx electron-builder --win --publish never

      # ---- signed (SignPath) ----
      # 1. sign the app files, 2. build the installer + portable from them,
      # 3. sign those, 4. rebuild latest.yml / .blockmap from the signed installer.
      - name: Build app files
        if: env.SIGN == 'true'
        run: npx electron-builder --win --dir --publish never
      - name: Upload app files for signing
        if: env.SIGN == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: dist/win-unpacked
      - name: Sign app files
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: chatlings
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Build installer and portable from the signed app
        if: env.SIGN == 'true'
        shell: bash
        run: |
          rm -rf dist/win-unpacked && mv signed-app dist/win-unpacked
          npx electron-builder --win --prepackaged dist/win-unpacked --publish never
      - name: Upload installers for signing
        if: env.SIGN == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: dist/*.exe
      - name: Sign installers
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: chatlings
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers
      - name: Use the signed installers, rebuild latest.yml
        if: env.SIGN == 'true'
        shell: bash
        run: |
          cp signed-installers/*.exe dist/
          node scripts/update-latest-yml.mjs dist

      - uses: actions/upload-artifact@v7
        with:
          name: win
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.dmg

  # One job creates the release and uploads everything. Letting electron-builder
  # publish targets in parallel makes each try to create the release, and all
  # but the first fail. latest.yml / latest-linux.yml + .blockmap are what the
  # installed apps' auto-update reads.
  publish:
    needs: [build-win, build-linux, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Chatlings ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Opens the winget-pkgs PR for each new release. Needs a classic GitHub token
  # with public_repo scope in the WINGET_TOKEN secret, and the first version
  # (submit69.Chatlings 0.1.1) already merged into microsoft/winget-pkgs.
  winget:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Skip (no WINGET_TOKEN secret)
        if: env.HAS_TOKEN != 'true'
        run: echo "WINGET_TOKEN not set; skipping winget update."
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: env.HAS_TOKEN == 'true'
        with:
          identifier: submit69.Chatlings
          installers-regex: 'Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: submit69
