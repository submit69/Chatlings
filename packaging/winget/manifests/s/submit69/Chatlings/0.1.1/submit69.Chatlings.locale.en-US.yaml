ShortDescription: Floating chat heads for Zalo, Messenger, WhatsApp, Telegram, Discord and more, with several accounts at once.
Description: |-
  Chatlings puts your web chats in floating bubbles on the edge of the screen, like chat heads on a phone.
  It runs each service's official web app in its own isolated profile, so you can use several accounts of the same app at once.
  Bubbles show unread counts, preview new messages on hover, hide from screen sharing, and can sleep to save RAM.
  No telemetry.
